# System-under-test targets + judge configuration for the CLI.
# Override with `agent-evals run --config <path>`.
#
# The BFF loads the chat thread on every run and errors if it is missing, so the
# harness creates one via the GraphQL `createThread` mutation before the first
# turn (`create_thread: true`, the default). Set `create_thread: false` (and/or
# `graphql_url: <url>`) for a backend that accepts an arbitrary threadId.

targets:
  # Backend running under its no-auth dev profile in the SAME pod as the eval.
  local:
    transport: agui_sse
    base_url: "http://localhost:8080/api/v1/bff/ai/agent/sse"
    auth:
      type: local_jwt          # no-SSO dev access: self-asserted unsigned JWT (backend dev profile)
      # The agent serves ONLY the caller's own talent profile (resolved from this GPN).
      # Use a real GPN that already HAS a profile in the dev datastore (e.g. your own);
      # a missing/fake GPN makes the agent reply "I can't find your profile" and content
      # metrics will be meaningless. There is no in-pod way to seed a profile.
      gpn: "${AGENT_EVALS_GPN}"   # set in a gitignored .env (copy .env.example)
      roles: ["GEB_HR", "HR_WITH_HR", "ADMIN"]
      scopes: ["readwrite.api.bff"]   # REQUIRED by the chat SSE endpoint
      user_claim: "ubs_auth_gpn"
    timeout_s: 120

  # Cloud / devpod: eval runs remotely and reaches the backend over the forwarded
  # HTTPS URL. Same no-SSO token (NO interactive Microsoft login).
  devpod:
    transport: agui_sse
    base_url: "https://REPLACE-ME-devpod-8080/api/v1/bff/ai/agent/sse"   # forwarded devpod port 8080
    auth:
      type: local_jwt
      gpn: "${AGENT_EVALS_GPN}"   # set in a gitignored .env (copy .env.example)
      roles: ["GEB_HR", "HR_WITH_HR", "ADMIN"]
      scopes: ["readwrite.api.bff"]
      # Alternative for a real SSO environment:
      #   type: static
      #   token_env: "AGENT_EVALS_TOKEN"
    timeout_s: 120
    # TLS for corporate / private-CA endpoints. Pick ONE:
    tls:
      use_truststore: true    # use the OS trust store / Keychain — recommended; needs `pip install truststore`
      # ca_bundle: "/path/to/corp-root-ca.pem"   # verify against an explicit CA bundle
      # insecure: false                          # disable TLS verification (dev only; NOT recommended)

# Judge backends (neutral interface). default applies to every judged metric;
# per_metric overrides a specific one so backends can be A/B'd.
# `langchain_azure` builds the SAME langchain_openai.AzureChatOpenAI client the
# hr-agent uses (api-key + the four AZURE_OPENAI_* vars, no max_tokens), so the
# judge reaches the deployment over the same path the agent already uses on the
# pod. Put the same AZURE_OPENAI_* values the agent uses in your .env.
judge:
  default: langchain_azure    # langchain_azure | azure_openai | openai | mlflow | deepeval | heuristic
  per_metric: {}
  # e.g.
  #   faithfulness: deepeval
  #   safety: mlflow

# Optional run-wide scorer config.
scoring:
  # latency_total_sla_ms: 8000
  topic_scope: "HR and career: profile/skills management, job/role discovery, recruiter outreach, career guidance."
  # persona: "<paste the orchestrator persona here or load from a file>"
