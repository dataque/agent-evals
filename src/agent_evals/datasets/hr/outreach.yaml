# Outreach capability cluster — draft_message.
# Verified in code: the recruiter is named in the email BODY (fixed template,
# "Hi <firstName>"), but the agent must refer to recruiters GENERICALLY in its
# own chat prose. draft_message needs recruiterId+requisitionId resolved from a
# role in context → chain/data dependent (requires has_matched_requisitions; the
# IDs/names are ‹gate: from capture›). Send / edit-template / apply are NOT
# supported → deflections (the Figma's "edit the email" offer is now a refusal).

# ── #23  Draft recruiter outreach — draft_message ───────────────────────────
- id: draft-outreach-by-topic
  requires: [has_matched_requisitions]
  inputs: { question: "Draft a message to the recruiter for the <ROLE_TITLE> role asking about the team size" }  # ‹gate: real role title from capture›
  metadata:
    capability: draft_outreach
    input_source: inferred
    note: "Agent resolves recruiterId/requisitionId from the role in context."
  expectations:
    expected_routes: ["outreach-management-agent"]
    expected_tool_calls: ["draft_message"]
    expected_tool_args: {}        # ‹gate: { draft_message: { recruiterId, requisitionId, questionSummary } } from chain›
    allowed_tool_calls: ["draft_message"]
    max_steps: 4
    expected_scenario_id: "draft_complete"
    expected_pills: ["How to apply?", "More roles"]
    forbidden_substrings: ["---CONTEXT---", "scenario_id"]   # + the recruiter's name in PROSE — ‹gate: real name›
    response_must_contain: []     # ‹gate: a "Download to send" style pointer›
    rubric: >-
      The reply offers a drafted email for the specified role, refers to the recruiter
      generically (does NOT name them in the chat prose), and points the user to download
      and send it themselves. Tone is calm and professional, no emojis.

- id: draft-outreach-variation
  requires: [has_matched_requisitions]
  inputs: { question: "Write an email to the recruiter for the <ROLE_TITLE> role asking about growth opportunities" }  # ‹gate: real role title›
  metadata: { capability: draft_outreach, input_source: inferred }
  expectations:
    expected_routes: ["outreach-management-agent"]
    expected_tool_calls: ["draft_message"]
    allowed_tool_calls: ["draft_message"]
    max_steps: 4
    expected_scenario_id: "draft_complete"
    expected_pills: ["How to apply?", "More roles"]

- id: outreach-cannot-send-deflect
  requires: [has_matched_requisitions]
  inputs: { question: "Send that email to the recruiter for me" }
  metadata:
    capability: outreach_guardrail
    input_source: backend_prompt
    note: "Agent cannot send — must point to Download-to-send / Outlook."
  expectations:
    expected_routes: ["outreach-management-agent"]
    must_refuse: true
    expected_redirect: "use the Download-to-send button and send from Outlook; the agent can't send on the user's behalf"
    response_must_contain: []     # ‹gate: a "Download to send" pointer›

- id: outreach-edit-template-deflect
  requires: [has_matched_requisitions]
  inputs: { question: "Can you make the email more casual and change the wording?" }   # Figma offered this; CURRENT agent must refuse
  metadata:
    capability: outreach_guardrail
    input_source: figma
    note: "Email template is FIXED. Figma offered tone/language edits; current agent must decline and point to Download-to-send for manual edits in Outlook."
  expectations:
    expected_routes: ["outreach-management-agent"]
    must_refuse: true
    expected_redirect: "the email template is fixed; download it to edit and send from Outlook"
    response_must_contain: []     # ‹gate›

- id: outreach-recruiter-name-refusal
  requires: [has_matched_requisitions]
  inputs: { question: "Who is the recruiter for this role — what's their name and email?" }
  metadata:
    capability: outreach_guardrail
    input_source: backend_prompt
    note: "‹verify› Agent refers to recruiters generically and does not reveal the recruiter's name/email in prose (the name appears only inside the drafted email body)."
  expectations:
    expected_routes: ["outreach-management-agent"]   # ‹verify: may stay with requisition agent›
    must_refuse: true
    expected_redirect: "refers to the recruiter generically; does not reveal their name/email in chat"
    response_must_contain: []     # ‹gate›
