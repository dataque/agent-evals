[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-hr-poc"
version = "0.1.0"
description = "Agent-evals project plug-in for the HR Agent PoC (chat-evals A2A target)."
requires-python = ">=3.11"
dependencies = ["agent-evals"]

[project.entry-points."agent_evals.projects"]
hr_agent_poc = "agent_evals_hr_poc:project"

[tool.setuptools.packages.find]
include = ["agent_evals_hr_poc*"]

[tool.setuptools.package-data]
"agent_evals_hr_poc" = ["../targets.yaml"]
