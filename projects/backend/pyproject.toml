[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-backend"
version = "0.1.0"
description = "Agent-evals project plug-in for the backend production HR agent (A2A)."
requires-python = ">=3.11"
dependencies = ["agent-evals"]

[project.entry-points."agent_evals.projects"]
backend = "agent_evals_backend:project"

[tool.setuptools.packages.find]
include = ["agent_evals_backend*"]

[tool.setuptools.package-data]
"agent_evals_backend" = ["schemas/*.json"]
