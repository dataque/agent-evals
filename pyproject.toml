[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals"
version = "0.1.0"
description = "Protocol-pluggable evaluation framework for tool-calling chat agents (A2A first, AGUI next)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "agent-evals contributors" }]

dependencies = [
    "mlflow[databricks]>=3.10.0",
    "nest-asyncio",
    "pyyaml",
    "requests",
    "pandas",
    "python-dotenv",
    "pysqlite3-binary",
    "jsonschema>=4.21",
    "pydantic>=2.5",
    "msal>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
]
deepeval = ["deepeval"]
ragas = ["ragas"]

[project.scripts]
agent-evals = "agent_evals.cli.__main__:main"

[project.entry-points."agent_evals.projects"]
# Project plug-ins register here. Each plug-in package adds itself.

[tool.setuptools.packages.find]
include = ["agent_evals*"]

[tool.setuptools.package-data]
"agent_evals.protocols.a2a" = ["schemas/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
