[project]
name = "agent-evals"
version = "0.1.0"
description = "Generic, framework-independent evaluation system for agentic chat systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.6",
    "tiktoken>=0.6",
    "jsonpatch>=1.33",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Metrics backend (sink) — one swappable adapter; the core never imports it.
mlflow = ["mlflow>=2.14"]
# Optional judge backends, behind the neutral Judge interface.
deepeval = ["deepeval>=1.0"]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0"]
all = ["mlflow>=2.14", "deepeval>=1.0", "openai>=1.30", "pytest>=8.0"]

[project.scripts]
agent-evals = "agent_evals.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
